name: iOS SDK

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    tags: ['0.2.3']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Swift Package semantic version to validate"
        required: true
        default: "0.2.3"

permissions:
  contents: read

concurrency:
  group: ios-sdk-v2-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Resolve packages
        run: swift package resolve
      - name: Verify release version
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "0.2.3" || {
            echo "This validation workflow is scoped to version 0.2.3; received: $RELEASE_TAG" >&2
            exit 1
          }
          test -f Package.swift
          grep -q 'name: "AceID"' Package.swift

      - name: Compile and test the iOS Simulator target
        shell: bash
        run: |
          set -euo pipefail
          SCHEMES="$(xcodebuild -list -json)"
          echo "$SCHEMES"
          SCHEME="$(printf '%s' "$SCHEMES" | jq -r '([.workspace.schemes[]?, .project.schemes[]?] | map(select(. == "AceID" or . == "AceID-Package")) | .[0]) // empty')"
          if [ -z "$SCHEME" ]; then
            SCHEME="$(printf '%s' "$SCHEMES" | jq -r '([.workspace.schemes[]?, .project.schemes[]?] | unique | .[0]) // empty')"
          fi
          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme was generated for the Swift Package."
            exit 1
          fi
          DEVICE="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone "))) | .name] | sort | last')"
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "null" ]; then
            echo "No available iPhone Simulator was found."
            exit 1
          fi
          xcodebuild -scheme "$SCHEME" -destination "platform=iOS Simulator,name=$DEVICE" test
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' build
