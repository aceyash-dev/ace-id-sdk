name: iOS SDK

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sdk-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Resolve packages
        run: swift package resolve
      - name: Compile and test the iOS Simulator target
        shell: bash
        run: |
          set -euo pipefail
          SCHEMES="$(xcodebuild -list -json)"
          echo "$SCHEMES"
          SCHEME="$(printf '%s' "$SCHEMES" | jq -r '([.workspace.schemes[]?, .project.schemes[]?] | map(select(. == "AceID" or . == "AceID-Package")) | .[0]) // empty')"
          if [ -z "$SCHEME" ]; then
            SCHEME="$(printf '%s' "$SCHEMES" | jq -r '([.workspace.schemes[]?, .project.schemes[]?] | unique | .[0]) // empty')"
          fi
          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme was generated for the Swift Package."
            exit 1
          fi
          DEVICE="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone "))) | .name] | sort | last')"
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "null" ]; then
            echo "No available iPhone Simulator was found."
            exit 1
          fi
          xcodebuild -scheme "$SCHEME" -destination "platform=iOS Simulator,name=$DEVICE" test
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' build
