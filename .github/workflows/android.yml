name: Android SDK

on:
  push:
    branches:
      - feat/android-native-auth
    paths:
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build Android library
        working-directory: android
        run: gradle test assemble

      - name: Prepare AAR
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && 'v0.1.1' || inputs.release_tag }}
        run: |
          mkdir -p release
          cp android/library/build/outputs/aar/library-release.aar "${{ github.workspace }}/release/ace-id-sdk-android-${RELEASE_TAG}.aar"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-id-sdk-android
          path: release/*.aar

  release:
    needs: build
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download successful build artifact
        uses: actions/download-artifact@v5
        with:
          name: ace-id-sdk-android
          path: release

      - name: Create GitHub release and upload AAR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && 'v0.1.1' || inputs.release_tag }}
          RELEASE_TARGET: ${{ github.event_name == 'push' && 'eeea16b555935c92c7ec071ecc26eb0648bc11b3' || github.sha }}
        run: |
          test -f "release/ace-id-sdk-android-${RELEASE_TAG}.aar"
          gh release create "${RELEASE_TAG}"             "release/ace-id-sdk-android-${RELEASE_TAG}.aar"             --repo "${GITHUB_REPOSITORY}"             --target "${RELEASE_TARGET}"             --title "Android SDK ${RELEASE_TAG}"             --generate-notes
