name: Android SDK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build Android library
        working-directory: android
        run: gradle test assemble

      - name: Prepare AAR
        run: |
          mkdir -p release
          cp android/library/build/outputs/aar/library-release.aar "${{ github.workspace }}/release/ace-id-sdk-android-${{ inputs.release_tag }}.aar"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-id-sdk-android
          path: release/*.aar

  release:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download successful build artifact
        uses: actions/download-artifact@v5
        with:
          name: ace-id-sdk-android
          path: release

      - name: Create GitHub release and upload AAR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -f "release/ace-id-sdk-android-${RELEASE_TAG}.aar"
          gh release create "$RELEASE_TAG"             "release/ace-id-sdk-android-${RELEASE_TAG}.aar"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Android SDK $RELEASE_TAG"             --generate-notes
